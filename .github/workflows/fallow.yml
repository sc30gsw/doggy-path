name: Fallow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fallow:
    runs-on: ubuntu-latest
    steps:
      # audit compares against the merge base, which a shallow clone does not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: fallow-rs/fallow@v3
        with:
          command: audit
